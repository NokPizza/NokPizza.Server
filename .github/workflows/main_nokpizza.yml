name: Build and deploy ASP.Net Core app to Azure Web App

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to deploy, such as refs/tags/v1.2.3
        required: false
        type: string
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"

      - name: Build with dotnet
        run: dotnet build source/NokPizza.Server/NokPizza.Server.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish source/NokPizza.Server/NokPizza.Server.csproj -c Release -o "${{ runner.temp }}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AB692D7056494FAD8E8A5DB23F98F76C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_82B0C665865A44C3A4223170C31B1277 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_0EE8336190534406A42211F55D201CE8 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "nokpizza"
          slot-name: "Production"
          package: .
